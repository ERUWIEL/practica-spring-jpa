<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Catalogo de juegos - GamesShop😼</title>
</head>
<body>
    <main class="container">
        <div>
            <h2>Catalogo de juegos</h2>
            <a th:href="@{/juegos/nuevo}">++Nuevo Juego</a>
        </div>

        <div class="grid">
            <div class="panel juegos" th:each="juego: ${juegos}">
                <a th:href="@{/juegos{id}(id=${juego.id}})}">

                <img th:href="${#strings.startsWith(juego.portadaUrl, 'http')} ? ${juego.portadaUrl} : @{/uploads/{img}(img=${juego.portadaUrl})}"
                alt="portada juego" onerror="this.onerror=null; this.src='https://via.placeholder.com/300x400?text=Sin+Imagen'"
                >

                <div class="game-content">
                    <h3 th:text="${juego.titulo}">Titulo de juego</h3>
                    <p th:text="${juego.descripcion}"></p>
                </div>
            </div>

            <div th:if="${#lists.isEmpty(juegos)}">
                No hay juegos todavia :(
            </div>

        </div>
    </main>
</body>
</html>
